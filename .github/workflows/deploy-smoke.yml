name: Post-deploy smoke test

on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Pages']
    types: [completed]
    branches: [main]

jobs:
  smoke-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Determine deployed URL
        id: url
        run: |
          PROJECT_NAME="${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tepuq' }}"
          echo "deploy_url=https://${PROJECT_NAME}.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to be reachable
        run: |
          URL="${{ steps.url.outputs.deploy_url }}"
          echo "Waiting for $URL to be reachable..."
          for i in {1..30}; do
            if curl -fsS "$URL" > /dev/null; then
              echo "Site is reachable after ${i} attempts."
              exit 0
            fi
            echo "Attempt $URL failed, retrying in 10s..."
            sleep 10
          done
          echo "Deployment did not become reachable in time."
          exit 1

      - name: Run post-deploy smoke tests
        id: smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.url.outputs.deploy_url }}
        run: |
          bunx playwright test tests/e2e/deploy-smoke.spec.js

      - name: Create issue on smoke test failure
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Post-deploy smoke test failed for ${{ github.event.workflow_run.head_sha }}" \
            --body "The post-deploy smoke test failed after the Cloudflare Pages deployment.\n\n- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n- Deployed URL: ${{ steps.url.outputs.deploy_url }}\n\nPlease investigate." \
            --label "bug,deploy"
