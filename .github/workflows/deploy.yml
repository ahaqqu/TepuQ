name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Setup Wrangler config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          bunx wrangler whoami || true
          bunx wrangler kv namespace list --format=json 2>/dev/null > /tmp/kv_list.json
          echo "KV list raw:"
          head -c 500 /tmp/kv_list.json
          echo ""
          node -e "
            const fs = require('fs');
            const input = fs.readFileSync('/tmp/kv_list.json', 'utf8').trim();
            if (!input) { console.error('Empty KV list response'); process.exit(1); }
            let data;
            try { data = JSON.parse(input); } catch (e) { console.error('JSON parse error:', e.message, 'input:', input.slice(0, 200)); process.exit(1); }
            const ns = Array.isArray(data) ? data.find(n => n.title === 'TEPUQ_SYNC') : null;
            fs.writeFileSync('/tmp/kv_ns_id.txt', ns ? ns.id : '');
            console.log('Found existing KV:', ns ? ns.id : 'none');
          "
          NS_ID=$(cat /tmp/kv_ns_id.txt)
          if [ -z "$NS_ID" ]; then
            echo "Creating KV namespace TEPUQ_SYNC..."
            bunx wrangler kv namespace create TEPUQ_SYNC --format=json 2>/dev/null > /tmp/kv_create.json
            echo "KV create raw:"
            head -c 500 /tmp/kv_create.json
            echo ""
            node -e "
              const fs = require('fs');
              const input = fs.readFileSync('/tmp/kv_create.json', 'utf8').trim();
              if (!input) { console.error('Empty KV create response'); process.exit(1); }
              let data;
              try { data = JSON.parse(input); } catch (e) { console.error('JSON parse error:', e.message, 'input:', input.slice(0, 200)); process.exit(1); }
              fs.writeFileSync('/tmp/kv_ns_id.txt', data.id || '');
              console.log('Created KV:', data.id || 'none');
            "
          fi
          NS_ID=$(cat /tmp/kv_ns_id.txt)
          if [ -z "$NS_ID" ]; then
            echo "Failed to get or create KV namespace"
            exit 1
          fi
          echo "KV namespace ID: $NS_ID"
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
            config.kv_namespaces = [{ binding: 'TEPUQ_SYNC', id: '$NS_ID' }];
            fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Set Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEPUQ_USER: ${{ secrets.TEPUQ_USER }}
          TEPUQ_PASS: ${{ secrets.TEPUQ_PASS }}
          TEPUQ_JWT_SECRET: ${{ secrets.TEPUQ_JWT_SECRET }}
        run: |
          set -e
          PROJECT_NAME="${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tepuq' }}"
          printf "%s\n" "$TEPUQ_USER" | bunx wrangler pages secret put TEPUQ_USER --project-name="${PROJECT_NAME}"
          printf "%s\n" "$TEPUQ_PASS" | bunx wrangler pages secret put TEPUQ_PASS --project-name="${PROJECT_NAME}"
          printf "%s\n" "$TEPUQ_JWT_SECRET" | bunx wrangler pages secret put TEPUQ_JWT_SECRET --project-name="${PROJECT_NAME}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          PROJECT_NAME="${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tepuq' }}"
          bunx wrangler pages deploy dist --project-name="${PROJECT_NAME}"
