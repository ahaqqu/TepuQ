name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          PROJECT_NAME="${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tepuq' }}"

          if ! bunx wrangler pages project list 2>/dev/null | grep -q "^${PROJECT_NAME}\b"; then
            echo "Pages project '${PROJECT_NAME}' not found. Creating it..."
            bunx wrangler pages project create "${PROJECT_NAME}" --production-branch=main
          fi

          bunx wrangler pages deploy dist --project-name="${PROJECT_NAME}"
